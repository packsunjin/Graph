; 라즈베리파이 음악 플레이어 설정
; 바꾼 뒤에는 다시 시작하세요:  systemctl --user restart music-player

[player]
; 음악을 찾을 폴더 (쉼표로 여러 개 가능, 하위 폴더도 찾음)
music_dirs = ~/Music
; 처음 켰을 때 볼륨 (0~100). 한 번 쓰고 나면 마지막 볼륨을 기억함
start_volume = 50
; 버튼 한 번에 바뀌는 볼륨
volume_step = 5
; 셔플 기본값 (다음 버튼을 2초 누르면 바꿀 수 있음)
shuffle = no
; 소리 출력 방식 (보통은 바꿀 필요 없음)
audio_output = pipewire,pulse,alsa

[bluetooth]
; 이어폰 주소. ./pair.sh 를 실행하면 자동으로 채워짐 (예: AA:BB:CC:DD:EE:FF)
mac =
; 이어폰 연결이 끊기면 일시정지 (스피커로 갑자기 소리가 나지 않게 함)
pause_on_disconnect = yes
; 이어폰이 다시 연결되면 이어서 재생
resume_on_connect = yes

[buttons]
; GPIO 핀 번호 (BCM 번호). 버튼 한쪽은 이 핀에, 다른 쪽은 GND에 연결
play = 17
next = 27
prev = 22
volume_up = 23
volume_down = 24
; 재생 버튼을 몇 초 누르면 전원을 끌지
shutdown_hold_seconds = 3
