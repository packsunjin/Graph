<title>기말 학습지 바인더</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 밝은 모드 고정. 이동은 한 줄로만: 홈(과목별 구역) → 학습지 → 단계 탭.
   화면마다 버튼은 꼭 필요한 것만: 홈 = 학습지 타일 + 오늘 복습 / 학습지 = 단계 탭 4개 + 다음 단계 버튼 1개.
   근거: 시험 효과·간격 효과·오답 피드백, 익숙한 고딕 한 가지, 글줄 66자 이내 */
:root {
  color-scheme:light;
  --bg:#f5f7fa; --surface:#ffffff; --ink:#191c22; --muted:#5a6271; --line:#dfe3ea; --soft:#eef1f5;
  --action:#2453c9; --ok:#13804a; --ok-soft:#e3f3ea; --no:#c62d36; --no-soft:#fbe7e8;
  --c-b:#1f4fc4; --c-g:#0d8a3e; --c-p:#7a35b8; --c-r:#d6202a; --hl:#fff176;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r-sm:8px; --r-md:12px; --btn-h:44px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:var(--f); font-size:16px; line-height:1.65; word-break:keep-all; }
.wrap { max-width:1120px; margin:0 auto; padding-block:14px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--action); outline-offset:2px; }
h1, h2 { text-wrap:balance; letter-spacing:-0.3px; margin:0; }
.muted { color:var(--muted); }
.num { font-variant-numeric:tabular-nums; }

/* 상단: 경로 + 오늘 복습 (버튼 2개뿐) */
.top { display:flex; align-items:center; gap:12px; min-height:48px; margin-bottom:20px; }
.crumbs { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:15px; min-width:0; flex:1; }
.crumbs button { background:none; border:0; padding:4px 2px; cursor:pointer; color:var(--muted); }
.crumbs button:hover { color:var(--ink); }
.crumbs .here { font-weight:700; color:var(--ink); }
.crumbs .sep { color:var(--line); }
.crumbs .home { font-weight:700; color:var(--ink); }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:var(--btn-h); padding:0 18px; border-radius:var(--r-sm);
  border:1px solid color-mix(in srgb, var(--ink) 20%, transparent); background:var(--surface); cursor:pointer; font-size:15px; font-weight:500; white-space:nowrap;
  transition:transform 120ms var(--ease), background-color 120ms var(--ease); }
.btn.primary { background:var(--action); border-color:var(--action); color:#fff; }
.btn:disabled { opacity:.45; cursor:default; }
.btn .count { min-width:22px; height:22px; padding:0 6px; border-radius:11px; background:var(--action); color:#fff; font-size:13px; display:inline-grid; place-items:center; }
.btn.primary .count { background:#fff; color:var(--action); }
@media (hover:hover) and (pointer:fine) {
  .btn:not(:disabled):hover { transform:translateY(-1px); background:color-mix(in srgb, var(--surface) 90%, var(--ink)); }
  .btn.primary:not(:disabled):hover { background:color-mix(in srgb, var(--action) 86%, var(--ink)); }
  .tile:hover { transform:translateY(-2px); border-color:color-mix(in srgb, var(--ink) 30%, transparent); }
  .opt:not(:disabled):hover { border-color:color-mix(in srgb, var(--ink) 35%, transparent); }
}
.btn:active { transform:translateY(1px) scale(.985); }

/* 홈: 과목 구역 */
.subj { margin-bottom:28px; }
.subj-head { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.subj-head h2 { font-size:20px; }
.subj-head span { font-size:14px; color:var(--muted); }
.unit { font-size:14px; color:var(--muted); margin:0 0 6px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; margin-bottom:12px; }
.tile { display:flex; flex-direction:column; gap:2px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:14px 16px; cursor:pointer; transition:transform 180ms var(--ease), border-color 120ms var(--ease); min-height:96px; }
.tile b { font-size:17px; line-height:1.35; }
.tile small { font-size:14px; color:var(--muted); }
.tile .dots { display:flex; gap:4px; margin-top:auto; padding-top:10px; }
.tile .dots i { flex:1; height:5px; border-radius:3px; background:var(--soft); }
.tile .dots i.on { background:var(--ok); }
.slot { border:1px dashed var(--line); border-radius:var(--r-md); padding:14px 16px; color:var(--muted); font-size:15px; background:transparent; }

/* 학습지: 단계 탭 4개 */
.whead { margin-bottom:14px; }
.whead h1 { font-size:clamp(24px, 3vw, 30px); line-height:1.25; }
.whead p { margin:4px 0 0; font-size:14px; color:var(--muted); }
.steps { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); overflow:hidden; margin-bottom:14px; }
.steps button { border:0; background:none; cursor:pointer; padding:12px 8px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:15px; color:var(--muted); position:relative; }
.steps button + button { border-left:1px solid var(--line); }
.steps button b { font-size:16px; }
.steps button small { font-size:13px; }
.steps button[aria-current="step"] { color:var(--ink); background:var(--soft); }
.steps button[aria-current="step"]::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--ink); }
.steps button.done b::after { content:" ✓"; color:var(--ok); }

.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; }
.bar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; color:var(--muted); }
.bar .spacer { flex:1; }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; }
.legend span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px; background:var(--sw); }
.frame { overflow-x:auto; background:#fff; }
.frame iframe { display:block; border:0; width:100%; background:#fff; }
.next { display:flex; justify-content:flex-end; padding:14px; border-top:1px solid var(--line); }

/* 문제 */
.q { padding:20px; border-bottom:1px solid var(--line); }
.q .from { font-size:13px; color:var(--muted); margin-bottom:4px; }
.stem { margin:0 0 12px; font-weight:500; font-size:17px; max-width:66ch; }
.stem .n { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px; }
.bogi { border:1px solid var(--line); background:var(--bg); border-radius:var(--r-sm); padding:12px 16px; margin:0 0 12px; font-size:15px; line-height:1.8; max-width:66ch; }
.opts { display:flex; flex-direction:column; gap:6px; max-width:66ch; }
.opt { display:flex; gap:10px; align-items:flex-start; text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm); padding:10px 14px; min-height:var(--btn-h); cursor:pointer; font-size:16px; }
.opt .m { color:var(--muted); min-width:1.3em; }
.opt.right { border-color:var(--ok); background:var(--ok-soft); }
.opt.wrong { border-color:var(--no); background:var(--no-soft); }
.ox { display:flex; gap:8px; }
.ox .opt { min-width:72px; justify-content:center; font-size:18px; font-weight:700; }
.short { display:flex; gap:8px; flex-wrap:wrap; max-width:66ch; }
.short input { flex:1 1 220px; min-width:0; height:var(--btn-h); border:1px solid color-mix(in srgb, var(--ink) 20%, transparent); background:var(--surface); color:var(--ink); border-radius:var(--r-sm); padding:0 14px; font:inherit; font-size:17px; }
.short input:focus { outline:none; border-color:var(--action); box-shadow:0 0 0 3px color-mix(in srgb, var(--action) 20%, transparent); }
.short input.right { border-color:var(--ok); background:var(--ok-soft); }
.short input.wrong { border-color:var(--no); background:var(--no-soft); }
.fb { margin-top:12px; border-left:3px solid var(--line); padding:2px 0 2px 12px; max-width:66ch; }
.fb.right { border-color:var(--ok); } .fb.wrong { border-color:var(--no); }
.fb b { display:block; }
.fb .ex { color:var(--muted); font-size:15px; }
.src { margin-top:8px; font-size:13px; color:var(--muted); }
.notes { padding:14px 20px; font-size:14px; color:var(--muted); }
.notes a { color:var(--action); }

/* 복습 */
.review { max-width:760px; margin:0 auto; }
.progress { height:6px; border-radius:3px; background:var(--soft); overflow:hidden; margin:0 0 14px; }
.progress i { display:block; height:100%; background:var(--action); transform-origin:0 50%; }
.done-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:24px; }
.done-card p { color:var(--muted); margin:6px 0 16px; }

@media (max-width: 640px) {
  .steps button small { display:none; }
  .top .btn { padding:0 12px; }
  .top .btn .lbl::before { content:""; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>
    <button class="btn" id="reviewBtn" data-go="review"><span class="lbl">복습</span><span class="count num" id="dueN">0</span></button>
  </header>
  <main id="main"></main>
</div>

<script>
/* 학습지·문제 데이터 (국어). ox: a=true/false · short: a=인정 답 목록 · mc: a=정답 번호(1부터). 실전 문제는 기출 유형을 참고해 새로 만든 문항 */
const UNITS = [
  { name:"1. 한국 문학의 길", items:["tangungga","gangho","manheung","sijo"] },
  { name:"3. 국어의 어제와 오늘", items:["spacing"] },
  { name:"4. 세상을 보는 눈", items:["climate"] },
];
const WORKS = {
  tangungga: {
    title:"탄궁가", sub:"정훈", meta:[["갈래","가사"],["시대","조선 중기"],["주제","가난한 삶의 한탄과 체념·수용"]],
    sheets:[{id:"tangungga",label:"1~2쪽"}],
    concept:[
      {t:"ox", q:"「탄궁가」의 갈래는 연시조이다.", a:false, ex:"4음보로 길게 이어지는 가사입니다."},
      {t:"short", q:"'어이 살리', '무엇하리'처럼 답이 뻔한 내용을 질문 형식으로 말해 강조하는 표현법은?", a:["설의법","설의","설의적표현"], ex:"어이 살리 = 어떻게 살겠나 → 살 수 없다."},
      {t:"short", q:"화자가 사람처럼 표현하여 대화를 나누는 대상은? (네 글자)", a:["가난귀신","가난 귀신"], ex:"가난을 의인화한 대상이에요. 쫓아내려다 그 말을 듣고 받아들이게 됩니다."},
      {t:"mc", q:"'이바 아이들아 아무쪼록 힘을 써라'에서 '아이들'이 가리키는 사람은?", o:["화자의 자식들","종(하인)들","이웃 사람들","가난 귀신"], a:2, ex:"다음 줄 '건더기 건져 종을 주니'와 이어집니다. 청자 호명으로 바람을 드러냄(1번 ① 적절)."},
      {t:"ox", q:"화자는 안회·원헌 같은 고사 속 인물이 자신보다 더 가난했다고 말한다.", a:false, ex:"'원헌의 가난인들 나같이 극심할까' → 내가 더 가난하다는 강조예요."},
      {t:"short", q:"결사 '빈천도 내 (   )니 서러워해 무엇하리'의 빈칸에 들어갈 말은?", a:["분수","분"], ex:"가난을 자신의 분수로 받아들이는 자기 조정."},
      {t:"mc", q:"㉣ '무정한 세상은 다 나를 버리거늘 / 네 혼자 신의 있어…'에서 '신의 있는 존재'는?", o:["임금","이웃","가난 귀신","하늘"], a:3, ex:"세상은 떠났지만 가난만은 곁에 있다 → 인식의 전환. 사회 비판이 아니에요(3번 정답 ④)."},
    ],
    practice:[
      {t:"mc", src:"2015학년도 9월 고3 모의고사 「탄궁가」 표현상 특징 유형 참고", q:"윗글의 표현상 특징으로 적절하지 않은 것은?", o:["설의적 표현으로 화자의 처지를 한탄하고 있다.","고사 속 인물과 견주어 자신의 가난을 강조하고 있다.","일상적 소재를 통해 궁핍한 생활을 사실적으로 드러내고 있다.","의인화된 대상과의 대화를 통해 화자의 태도 변화가 드러난다.","계절의 순환에 따라 시상을 전개하며 정서의 변화를 보여 준다."], a:5, ex:"봄날(농사)이 나오긴 하지만 사계절 순환 구조가 아닙니다. 계절 순환은 「강호사시가」의 특징이에요."},
      {t:"mc", src:"정서 흐름 파악 유형", q:"윗글 화자의 정서 흐름으로 가장 적절한 것은?", o:["한탄 → 극복 의지 → 성취의 기쁨","한탄 → 가난을 떠나보내려는 시도 → 인식의 전환 → 수용","만족 → 갈등 → 원망","원망 → 사회 비판 → 저항","기대 → 좌절 → 분노"], a:2, ex:"서사~본사(한탄) → ㉢ 가난 귀신 전송 → '네 말도 다 옳도다'(전환) → 결사(체념·수용)."},
      {t:"mc", src:"시구 의미 파악 유형", q:"가난 귀신이 '어려서 지금까지 희로애락을 너와 함께하여'라고 말한 의도로 가장 적절한 것은?", o:["화자를 위협해 재산을 빼앗으려 한다.","화자와 오래 함께했음을 내세워 떠나지 않으려 한다.","화자가 게으르다는 점을 비판한다.","화자에게 새로운 일거리를 권한다.","화자가 임금의 은혜를 잊었다고 꾸짖는다."], a:2, ex:"오랜 동반자임을 내세우며 떠나기를 거부하고, 이 말에 화자가 설득됩니다."},
      {t:"mc", src:"<보기> 감상 유형", bogi:"「탄궁가」는 가난이라는 현실 문제에 대한 개선의 노력이 좌절되는 과정과, 가난을 의인화하여 희화화함으로써 스스로를 위로하는 과정을 함께 담고 있다.", q:"<보기>를 참고할 때, 희화화와 자기 위안이 가장 잘 드러난 부분은?", o:["삼십 일에 아홉 끼니 얻거나 못 얻거나","올벼 씨 한 말은 반 넘게 쥐 먹었고","술에 음식을 갖추고 이름 불러 전송하여","베틀 북도 쓸데없어 빈 벽에 남겨 두고","환곡 장리는 무엇으로 장만하며"], a:3, ex:"가난을 손님처럼 예를 갖춰 떠나보내는 장면 = 우스꽝스럽게 그려 웃으며 위안(㉢, 3번 ③)."},
    ]
  },
  gangho: {
    title:"강호사시가", sub:"맹사성", meta:[["갈래","연시조(4수)"],["시대","조선 전기"],["주제","강호에서 누리는 사계절의 즐거움과 임금의 은혜"]],
    sheets:[{id:"gangho",label:"1~2쪽"}],
    concept:[
      {t:"short", q:"자연(강호)의 즐거움을 노래하면서 그것을 임금의 은혜로 돌리는 조선 전기 사대부 시가의 경향은?", a:["강호가도"], ex:"각 수 종장 '역군은이샷다'가 그 증거."},
      {t:"mc", q:"각 수 종장에 반복되는 '역군은(亦君恩)이샷다'의 뜻은?", o:["임금이 원망스럽다","역시 임금의 은혜이시도다","임금을 그리워한다","임금께 벼슬을 청한다"], a:2, ex:"#영탄법 #유교적 충의 사상. 후렴구 역할 → 형식적 통일성."},
      {t:"ox", q:"제3수의 화자는 생계를 위해 그물로 고기를 잡는다.", a:false, ex:"'흘니 띄여 더져 두고' = 욕심 없이 띄워 둠. 생계형이 아닌 취미(가어옹), 소일거리예요."},
      {t:"short", q:"제4수 '누역으로 오슬 삼아'에서 '누역'의 뜻은? (짚으로 엮은 비옷)", a:["도롱이"], ex:"누더기가 아니라 도롱이! 눈이 와도 편안한 삶."},
      {t:"short", q:"'유신(有信)한 강파'에 쓰인 표현법은? (사람이 아닌 것을 사람처럼)", a:["의인법","의인화"], ex:"신의 있는 강물결 → 자연과의 친밀감."},
      {t:"ox", q:"계절의 변화에 따라 시상을 전개하며 각 수가 유사한 통사 구조를 반복한다.", a:true, ex:"초장 '강호에 ○○이 드니' / 종장 '이 몸이 ~히옴도 역군은이샷다'."},
    ],

      {t:"mc", src:"내용 일치 유형", q:"윗글의 내용과 일치하지 않는 것은?", o:["국내 언론은 기후 위기를 지속적으로 다루지 않는다.","검증 시스템이 미흡해 오류 있는 자료가 기사화되기도 한다.","재난 보도가 시민에게 공포감과 무력감을 주는 경우가 많다.","국내 언론은 선거 기간에 후보들에게 기후 위기 질문을 적극적으로 했다.","전담 팀을 구성하고 인력과 예산을 지원해야 한다."], a:4, ex:"적극적으로 하지 않았다는 것이 글의 비판 내용."},
      {t:"mc", src:"주장에 대한 반응 유형", q:"글쓴이의 주장에 따른 반응으로 적절하지 않은 것은?", o:["기후 재난 기사는 원인과 대안을 함께 다뤄야겠어.","기업 홍보 기사를 그대로 받아쓰지 말고 감시해야겠어.","공포감을 주는 보도를 늘려 시민의 경각심을 높여야겠어.","기후 위기 극복의 희망을 함께 보여 줘야겠어.","전문가가 사실을 검증하는 체계를 갖춰야겠어."], a:3, ex:"글쓴이는 공포감·무력감 주는 보도를 문제로 봄 → 희망과 구체적 대안 제시."},
      {t:"mc", src:"글의 전개 방식 유형", q:"윗글의 내용 전개 방식으로 가장 적절한 것은?", o:["시간 순서에 따라 사건을 서술한다.","문제점을 제기한 뒤 해결 방안을 제시한다.","두 대상의 공통점만을 나열한다.","개인의 경험을 중심으로 감상을 드러낸다.","가설을 세우고 실험으로 검증한다."], a:2, ex:"문제 제기(처음~141쪽 11행) → 대안 제시(141쪽 12행~끝), 09번 ○."},
    ]
  }
};


/* ───────── 과목 구역 ─────────
   학습지가 아직 없는 과목도 구역을 미리 둔다. 학습지를 넣으면 units에 단원·작품 id를 추가. */
const SUBJECTS = [
  { id:"korean",  name:"국어",     course:"공통국어2", units:UNITS },
  { id:"math",    name:"수학",     course:"공통수학2", units:[] },
  { id:"english", name:"영어",     course:"공통영어2", units:[] },
  { id:"history", name:"한국사",   course:"한국사2",   units:[] },
  { id:"social",  name:"통합사회", course:"통합사회2", units:[] },
  { id:"science", name:"통합과학", course:"통합과학2", units:[] },
];

/* ───────── 저장 (이 기기 브라우저) · 간격 반복: 틀리면 내일, 맞히면 1·3·7·14·30일 뒤 ───────── */
const KEY = "binder-v2", GAPS = [1, 3, 7, 14, 30];
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { S = {}; }
S.w = S.w || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function W(id) { return (S.w[id] = S.w[id] || { step:0, read:false, blanks:{}, q:{} }); }
const today = () => new Date().toISOString().slice(0, 10);
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const ALLWORKS = SUBJECTS.flatMap(s => s.units.flatMap(u => u.items));
const subjectOf = wid => SUBJECTS.find(s => s.units.some(u => u.items.includes(wid)));

function allQ(wid) { const w = WORKS[wid]; return [...w.concept.map((q,i)=>["concept",i,q]), ...w.practice.map((q,i)=>["practice",i,q])]; }
function record(wid, kind, i, ok) {
  const r = W(wid).q, k = kind + "-" + i, prev = r[k];
  const box = ok ? Math.min((prev ? prev.box : 0) + 1, GAPS.length - 1) : 0;
  r[k] = { ok, box, due: ok ? addDays(GAPS[box]) : addDays(1) }; save();
}
function dueList() { const out = []; ALLWORKS.forEach(wid => allQ(wid).forEach(([kind,i,q]) => { const r = W(wid).q[kind+"-"+i]; if (r && r.due <= today()) out.push([wid,kind,i,q]); })); return out; }
function stepsDone(wid) {
  const w = W(wid), b = Object.values(w.blanks);
  const all = kind => WORKS[wid][kind].every((q,i) => w.q[kind+"-"+i]);
  return [!!w.read, b.length > 0 && b.every(x => x.total && x.ok / x.total >= 0.8), all("concept"), all("practice")];
}

/* ───────── 화면 ───────── */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const norm = s => String(s).replace(/[\s.,·'"()]/g, "").toLowerCase();
const CIRC = ["①","②","③","④","⑤"];
const STEPS = [["읽기","필기 학습지"],["빈칸","필기 떠올리기"],["개념","OX·단답"],["실전","5지선다"]];
const narrow = () => innerWidth < 820;
let route = { view:"home" }, page = "1", hideNotes = false, review = null;

function renderTop() {
  const c = [`<button class="home" data-go="home">기말 학습지 바인더</button>`];
  if (route.view === "work") { const s = subjectOf(route.id); c.push(`<span class="sep">/</span><button data-go="home" data-anchor="${s.id}">${esc(s.name)}</button><span class="sep">/</span><span class="here">${esc(WORKS[route.id].title)}</span>`); }
  if (route.view === "review") c.push(`<span class="sep">/</span><span class="here">오늘 복습</span>`);
  $("#crumbs").innerHTML = c.join("");
  const n = dueList().length; $("#dueN").textContent = n;
  $("#reviewBtn").classList.toggle("primary", n > 0); $("#reviewBtn").hidden = route.view === "review";
}
function show(r, anchor) {
  route = r; history.replaceState(null, "", "#" + (r.view === "work" ? r.id : r.view));
  renderTop(); ({ home:renderHome, work:renderWork, review:renderReview })[r.view]();
  const el = anchor && document.getElementById("s-" + anchor); el ? el.scrollIntoView() : scrollTo({ top:0 });
}

function renderHome() {
  $("#main").innerHTML = SUBJECTS.map(s => {
    const n = s.units.reduce((a,u) => a + u.items.length, 0);
    return `<section class="subj" id="s-${s.id}"><div class="subj-head"><h2>${esc(s.name)}</h2><span>${esc(s.course)} · 학습지 ${n}개</span></div>
      ${n ? s.units.map(u => `<p class="unit">${esc(u.name)}</p><div class="grid">${u.items.map(w => {
        const d = stepsDone(w);
        return `<button class="tile" data-open="${w}"><b>${esc(WORKS[w].title)}</b><small>${esc(WORKS[w].sub)}</small><span class="dots" aria-label="${d.filter(Boolean).length}/4단계">${d.map(x=>`<i class="${x?'on':''}"></i>`).join("")}</span></button>`;
      }).join("")}</div>`).join("")
      : `<div class="slot">학습지 사진을 보내면 여기에 추가돼요.</div>`}</section>`;
  }).join("");
}

function renderWork() {
  const wid = route.id, w = WORKS[wid], st = route.step, d = stepsDone(wid);
  W(wid).step = st; save();
  $("#main").innerHTML = `
    <div class="whead"><h1>${esc(w.title)}</h1><p>${esc(w.sub)} · ${w.meta.map(([k,v])=>esc(v)).join(" · ")}</p></div>
    <nav class="steps" aria-label="단계">${STEPS.map(([l,s],i)=>`<button data-step="${i}" class="${d[i]?'done':''}" ${i===st?'aria-current="step"':''}><b>${i+1}. ${l}</b><small>${s}</small></button>`).join("")}</nav>
    <section class="panel" id="panel"></section>`;
  if (st < 2) renderSheet(wid, st === 1); else renderQuiz(wid, st === 2 ? "concept" : "practice");
}

/* 학습지 보기: 넓은 화면은 펼침 자동, 좁은 화면만 쪽 넘김 */
function renderSheet(wid, quiz) {
  const w = WORKS[wid], sh = w.sheets[route.sheet || 0];
  const tabs = w.sheets.length > 1 ? w.sheets.map((s,i)=>`<button class="btn" data-sheet="${i}" ${i===(route.sheet||0)?'aria-pressed="true" style="border-color:var(--ink)"':''}>${esc(s.label)}</button>`).join("") : "";
  const pageBtn = narrow() ? `<button class="btn" data-flip>${page === "1" ? "오른쪽 쪽 보기" : "왼쪽 쪽 보기"}</button>` : "";
  $("#panel").innerHTML = `<div class="bar">${tabs}
      ${quiz ? `<span id="bscore" class="num">노란 칸에 쓰고 Enter · 줄무늬 칸은 눌러서 확인</span>`
             : `<span class="legend"><span style="--sw:var(--c-b)">뜻 풀이</span><span style="--sw:var(--c-g)">표현법·개념어</span><span style="--sw:var(--c-p)">구조·흐름</span><span style="--sw:var(--c-r)">함정</span><span style="--sw:var(--hl)">핵심</span></span>`}
      <span class="spacer"></span>${pageBtn}
      ${quiz ? `<button class="btn" data-cmd="reveal">정답 보기</button>` : `<button class="btn" data-hide>${hideNotes ? "필기 보이기" : "필기 가리기"}</button>`}
    </div>
    <div class="frame"><iframe id="sheet" title="${esc(w.title)} 학습지" src="sheets/${sh.id}.html"></iframe></div>
    <div class="next"><button class="btn primary" data-step="${quiz ? 2 : 1}" ${quiz ? "" : `data-read="${wid}"`}>다음 단계: ${quiz ? "3. 개념" : "2. 빈칸"} →</button></div>`;
  size();
}
const curPage = () => narrow() ? page : "both";
function post(m) { const f = $("#sheet"); if (f && f.contentWindow) f.contentWindow.postMessage(m, "*"); }
function size() { const f = $("#sheet"); if (f) f.style.height = Math.ceil(f.parentElement.clientWidth * 297 / (curPage() === "both" ? 420 : 210)) + "px"; }
let lastNarrow = narrow();
addEventListener("resize", () => { size(); if (narrow() !== lastNarrow) { lastNarrow = narrow(); if (route.view === "work" && route.step < 2) renderWork(); } });
addEventListener("message", e => {
  const d = e.data || {};
  if (d.type === "sheet-ready") { post({ cmd:"page", page:curPage() }); post({ cmd:"mode", mode: route.step === 1 ? "quiz" : (hideNotes ? "clean" : "notes") }); }
  if (d.type === "sheet-score" && route.view === "work" && route.step === 1) {
    W(route.id).blanks[d.sheet] = { ok:d.ok, total:d.total }; save();
    const el = $("#bscore"); if (el) el.textContent = `맞힌 빈칸 ${d.ok}/${d.total}` + (d.covers ? ` · 긴 필기 ${d.opened}/${d.covers}` : "");
    const b = $('.steps [data-step="1"]'); if (b) b.classList.toggle("done", stepsDone(route.id)[1]);
  }
});

function qHTML(wid, kind, i, q, numLabel, from) {
  const id = `${wid}|${kind}|${i}`, r = W(wid).q[kind+"-"+i];
  let h = `<article class="q" data-id="${id}">${from ? `<div class="from">${esc(from)}</div>` : ""}<p class="stem"><span class="n">${numLabel}</span>${esc(q.q)}</p>`;
  if (q.bogi) h += `<div class="bogi"><b>&lt;보기&gt;</b><br>${esc(q.bogi)}</div>`;
  if (q.t === "mc") h += `<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-pick="${k+1}"><span class="m">${CIRC[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  if (q.t === "ox") h += `<div class="ox">${["○","×"].map((m,k)=>`<button class="opt" data-pick="${k===0}" aria-label="${k===0?'맞다':'틀리다'}">${m}</button>`).join("")}</div>`;
  if (q.t === "short") h += `<form class="short"><input id="in-${kind}-${i}-${wid}" autocomplete="off" placeholder="답 쓰기" aria-label="답"><button class="btn primary">확인</button></form>`;
  h += `<div class="fbw">${r && !review ? fb(q, r.ok) : ""}</div>${q.src ? `<div class="src">참고 유형: ${esc(q.src)}</div>` : ""}</article>`;
  return h;
}
function ans(q) { return q.t === "mc" ? CIRC[q.a-1] + " " + q.o[q.a-1] : q.t === "ox" ? (q.a ? "○" : "×") : q.a[0]; }
function fb(q, ok) { return `<div class="fb ${ok?'right':'wrong'}"><b>${ok ? "정답" : "정답: " + esc(ans(q))}</b><span class="ex">${esc(q.ex)}</span></div>`; }

function renderQuiz(wid, kind) {
  const list = WORKS[wid][kind];
  $("#panel").innerHTML = list.map((q,i)=>qHTML(wid, kind, i, q, (i+1)+".")).join("")
    + (kind==="practice" ? `<div class="notes">참고 유형: 2015학년도 9월 고3 모의고사 「탄궁가」, 수능 「만흥」 &lt;보기&gt; 유형, 국립국어원 띄어쓰기 판별 원리(<a href="https://www.korean.go.kr/nkview/nknews/200210/51_5.html" target="_blank" rel="noopener">새국어생활</a>). 기출 원문은 싣지 않고 같은 형식으로 새로 만들었어요.</div>` : "")
    + `<div class="next">${kind==="concept" ? `<button class="btn primary" data-step="3">다음 단계: 4. 실전 →</button>` : `<button class="btn primary" data-go="home" data-anchor="${subjectOf(wid).id}">${esc(subjectOf(wid).name)} 학습지 목록으로</button>`}</div>`;
}

/* 복습: 모든 과목 문제를 섞어 한 문제씩 */
function renderReview() {
  if (!review) { const due = dueList(); for (let i = due.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [due[i], due[j]] = [due[j], due[i]]; } review = { list:due, i:0, ok:0, answered:false }; }
  const R = review;
  if (R.i >= R.list.length) {
    $("#main").innerHTML = `<div class="review done-card"><h2>${R.list.length ? "오늘 복습 끝" : "오늘 복습할 문제 없음"}</h2><p>${R.list.length ? `${R.list.length}문제 중 ${R.ok}문제 맞혔어요. 틀린 문제는 내일 다시 나와요.` : "학습지의 개념·실전 문제를 풀면 날짜에 맞춰 여기에 다시 나와요."}</p><button class="btn primary" data-go="home">학습지 목록으로</button></div>`;
    review = null; renderTop(); return;
  }
  const [wid, kind, i, q] = R.list[R.i];
  $("#main").innerHTML = `<div class="review"><div class="progress" aria-hidden="true"><i style="transform:scaleX(${R.i / R.list.length})"></i></div>
    <section class="panel">${qHTML(wid, kind, i, q, `${R.i+1}/${R.list.length}`, `${subjectOf(wid).name} · ${WORKS[wid].title} · ${kind==="concept" ? "개념" : "실전"}`)}
    <div class="next"><button class="btn primary" id="nextq" disabled>다음 문제 →</button></div></section></div>`;
}

function answer(art, ok, q) {
  const [wid, kind, i] = art.dataset.id.split("|");
  record(wid, kind, +i, ok);
  $(".fbw", art).innerHTML = fb(q, ok);
  if (review) { if (!review.answered) { review.answered = true; if (ok) review.ok++; } $("#nextq").disabled = false; $("#nextq").focus(); }
  else { const b = $(`.steps [data-step="${kind==="concept"?2:3}"]`); if (b) b.classList.toggle("done", stepsDone(wid)[kind==="concept"?2:3]); }
  renderTop();
}
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go) { if (t.dataset.go === "review") review = null; show({ view:t.dataset.go }, t.dataset.anchor); return; }
  if (t.dataset.open) { show({ view:"work", id:t.dataset.open, step: W(t.dataset.open).step || 0 }); return; }
  if (t.dataset.step !== undefined && route.view === "work") {
    if (t.dataset.read) W(t.dataset.read).read = true;
    route.step = +t.dataset.step; route.sheet = 0; save(); renderWork(); scrollTo({ top:0 }); return;
  }
  if (t.dataset.sheet) { route.sheet = +t.dataset.sheet; renderWork(); return; }
  if (t.hasAttribute("data-flip")) { page = page === "1" ? "2" : "1"; t.textContent = page === "1" ? "오른쪽 쪽 보기" : "왼쪽 쪽 보기"; post({ cmd:"page", page }); return; }
  if (t.hasAttribute("data-hide")) { hideNotes = !hideNotes; t.textContent = hideNotes ? "필기 보이기" : "필기 가리기"; post({ cmd:"mode", mode: hideNotes ? "clean" : "notes" }); return; }
  if (t.dataset.cmd) { post({ cmd:t.dataset.cmd }); return; }
  if (t.id === "nextq") { review.i++; review.answered = false; renderReview(); return; }
  if (t.dataset.pick !== undefined) {
    const art = t.closest(".q"), [wid, kind, i] = art.dataset.id.split("|"), q = WORKS[wid][kind][+i];
    if (review && review.answered) return;
    const pick = q.t === "ox" ? t.dataset.pick === "true" : +t.dataset.pick, ok = pick === q.a;
    art.querySelectorAll(".opt").forEach(b => { b.classList.remove("right","wrong"); const v = q.t === "ox" ? b.dataset.pick === "true" : +b.dataset.pick; if (v === q.a) b.classList.add("right"); });
    if (!ok) t.classList.add("wrong");
    answer(art, ok, q);
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const art = e.target.closest(".q"), [wid, kind, i] = art.dataset.id.split("|"), q = WORKS[wid][kind][+i], inp = e.target.querySelector("input");
  if (review && review.answered) return;
  const v = q.strict ? inp.value.trim().replace(/\s+/g, " ") : norm(inp.value);
  const ok = q.a.some(a => (q.strict ? a : norm(a)) === v);
  inp.classList.toggle("right", ok); inp.classList.toggle("wrong", !ok);
  answer(art, ok, q);
});
function fromHash() {
  const h = location.hash.slice(1);
  if (WORKS[h]) return { view:"work", id:h, step:W(h).step || 0 };
  if (h === "review") return { view:"review" };
  return { view:"home" };
}
addEventListener("hashchange", () => { const r = fromHash(); if (r.view !== route.view || r.id !== route.id) show(r); });
show(fromHash());
</script>
