<!DOCTYPE html>
<!-- [화면 뼈대] 수어42 앱의 모든 화면(단어·상세·지역·퀴즈·실험실)이 들어 있는 한 장짜리 페이지예요.
     화면은 하단 탭을 누르면 js/app.js 가 하나씩 보여줘요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수어42</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">수어<span>42</span></h1>
    <p class="tagline">지역과 지역 <b>사이</b>의 수어</p>
  </header>

  <main>
    <!-- 불러오는 중 / 오류 안내 -->
    <p id="status" class="status">데이터를 불러오는 중…</p>

    <!-- ① 단어 목록 -->
    <section id="screen-list" class="screen">
      <div class="progress">
        <span id="progress-text"></span>
        <div class="progress-bar"><div id="progress-fill"></div></div>
      </div>
      <input id="search" class="search" type="search" placeholder="단어 검색 (예: 감사)">
      <div id="category-chips" class="chips"></div>
      <div id="word-list" class="card-grid"></div>
    </section>

    <!-- ② 단어 상세 -->
    <section id="screen-detail" class="screen">
      <button id="back-button" class="back">← 뒤로</button>
      <div id="detail"></div>
    </section>

    <!-- ③ 지역 모아보기 -->
    <section id="screen-region" class="screen">
      <h2 class="screen-title">지역별 모아보기</h2>
      <div id="region-map"></div>
      <div id="region-chips" class="chips"></div>
      <div id="region-list" class="card-grid"></div>
    </section>

    <!-- ④ 퀴즈 -->
    <section id="screen-quiz" class="screen">
      <h2 class="screen-title">어느 지역 수어일까?</h2>
      <div id="quiz"></div>
    </section>

    <!-- ⑦ 실험실 (Teachable Machine 자리) -->
    <section id="screen-lab" class="screen">
      <h2 class="screen-title">실험실 <span class="badge">준비 중</span></h2>
      <div id="lab"></div>
    </section>
  </main>

  <!-- 하단 탭바 -->
  <nav class="tabbar">
    <button data-screen="list" class="active"><span>📚</span>단어</button>
    <button data-screen="region"><span>🗺️</span>지역</button>
    <button data-screen="quiz"><span>🎯</span>퀴즈</button>
    <button data-screen="lab"><span>🧪</span>실험실</button>
  </nav>

  <!-- 순서 중요: 설정 → 데이터 → 각 화면 → 시작 -->
  <script src="config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/video.js"></script>
  <script src="js/list.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/region.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
