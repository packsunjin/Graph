<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>들을 앨범 순위</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ============ 색상 토큰 (라이트/다크) ============ */
:root{
  color-scheme: light;
  --page:#ffffff;
  --ink:#000000;
  --ink2:#3a3a3a;
  --muted:#757575;
  --rule:#000000;
  --hair:#e5e5e5;
  --red:#ff3530;
  --cover-bg:#f0f0f0;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0f0f0f;
    --ink:#ffffff;
    --ink2:#cfcfcf;
    --muted:#9a9a9a;
    --rule:#ffffff;
    --hair:#2a2a2a;
    --red:#ff5a55;
    --cover-bg:#1c1c1c;
  }
}
html[data-theme="dark"]{
  color-scheme: dark;
  --page:#0f0f0f;
  --ink:#ffffff;
  --ink2:#cfcfcf;
  --muted:#9a9a9a;
  --rule:#ffffff;
  --hair:#2a2a2a;
  --red:#ff5a55;
  --cover-bg:#1c1c1c;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Helvetica Neue",Arial,"Malgun Gothic",sans-serif;
  background:var(--page);
  color:var(--ink);
  line-height:1.6;
}

/* ============ 마스트헤드 ============ */
.mast{border-bottom:1px solid var(--rule);text-align:center;padding:22px 16px 18px}
.mast .logo{font-family:"Noto Serif KR",Georgia,serif;font-weight:900;font-size:30px;letter-spacing:-.02em}
.mast .nav{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}

/* ============ 순위 목차 ============ */
.index{max-width:980px;margin:0 auto;padding:28px 16px 8px;border-bottom:1px solid var(--hair)}
.index ol{list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 32px}
.index a{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;padding:8px 0;color:inherit;text-decoration:none;border-bottom:1px solid var(--hair)}
.index a:hover .t,.index a:focus-visible .t{text-decoration:underline;text-decoration-color:var(--red)}
.index .n{font-weight:800;font-variant-numeric:tabular-nums}
.index .t{min-width:0}
.index .t i{font-family:"Noto Serif KR",Georgia,serif;margin-left:6px}

main{max-width:980px;margin:0 auto;padding:0 16px 80px}

/* ============ 리뷰 ============ */
.review{padding:48px 0;border-bottom:1px solid var(--hair)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.cover{
  aspect-ratio:1/1;width:100%;background:var(--cover-bg);
  box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{font-family:"Noto Serif KR",Georgia,serif;font-style:italic;color:var(--muted);padding:20px;text-align:center}

.head{text-align:center}
.artist{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.title{font-family:"Noto Serif KR",Georgia,serif;font-style:italic;font-size:30px;font-weight:400;margin-top:6px;line-height:1.25}
.rank{
  width:84px;height:84px;margin:22px auto 0;border:3px solid var(--ink);border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
}
.rank b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.rank small{font-size:9px;font-weight:700;letter-spacing:.14em;margin-top:3px}
.bnm{display:inline-block;margin-top:16px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.meta{margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.meta span+span::before{content:"•";margin:0 8px}

.body{max-width:640px;margin:44px auto 0}
.genre{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.dek{font-family:"Noto Serif KR",Georgia,serif;font-size:20px;line-height:1.55;margin-top:18px;word-break:keep-all}
.text{font-family:"Noto Serif KR",Georgia,serif;font-size:16px;line-height:1.9;color:var(--ink2);margin-top:18px;word-break:keep-all}
.tracks{margin-top:22px;font-size:13px;color:var(--muted)}
.tracks b{color:var(--ink);font-weight:700}

/* ============ 한 줄 ============ */
.after{margin-top:36px;border-left:4px solid var(--red);padding:4px 0 4px 20px}
.line{font-family:"Noto Serif KR",Georgia,serif;font-weight:700;font-size:26px;line-height:1.4;word-break:keep-all}

@media (max-width:720px){
  .review{padding:32px 0}
  .hero{grid-template-columns:1fr;gap:28px}
  .artist{font-size:22px}
  .title{font-size:25px}
  .body{margin-top:32px}
  .dek{font-size:18px}
  .line{font-size:22px}
}
</style>
</head>

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){
  document.getElementById("count").textContent = `${ALBUMS.length}장의 앨범 · 순위`;
  document.getElementById("index").innerHTML = ALBUMS.map((a, i) =>
    `<li><a href="#r${i + 1}"><span class="n">${i + 1}</span><span class="t">${esc(a.artist)}<i>${esc(a.title)}</i></span></a></li>`
  ).join("");
  document.getElementById("list").innerHTML = ALBUMS.map((a, i) => {
    const tracks = a.tracks.map(t => t === a.title_track ? `<b>${esc(t)}</b>` : esc(t)).join(" · ");
    return `
    <article class="review" id="r${i + 1}">
      <div class="hero">
        <div class="cover" data-title="${esc(a.title)}">
          <img src="${esc(a.cover)}" alt="${esc(a.artist)} — ${esc(a.title)} 앨범 커버" referrerpolicy="no-referrer">
        </div>
        <div class="head">
          <div class="artist">${esc(a.artist)}</div>
          <h2 class="title">${esc(a.title)}</h2>
          <div class="rank"><b>${i + 1}</b><small>RANK</small></div>
          ${i === 0 ? `<div class="bnm">Best New Listen</div>` : ""}
          <div class="meta"><span>${esc(a.label)}</span><span>${esc(a.year)}</span><span>${esc(a.format)}</span></div>
        </div>
      </div>
      <div class="body">
        <div class="genre">${esc(a.genre)}</div>
        <p class="dek">${esc(a.dek)}</p>
        <p class="text">${esc(a.text)}</p>
        <p class="tracks">수록곡 — ${tracks}</p>
        <div class="after">
          <p class="line">“${esc(a.line)}”</p>
        </div>
      </div>
    </article>`;
  }).join("");

  // 커버를 못 불러오면 제목으로 대체
  document.querySelectorAll(".cover img").forEach(img => {
    const fallback = () => {
      const ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = img.parentElement.dataset.title;
      img.replaceWith(ph);
    };
    if(img.complete && !img.naturalWidth) fallback();
    else img.addEventListener("error", fallback, {once:true});
  });
}

try{
  const th = localStorage.getItem("survey-dashboard-data-v2:theme");
  if(th) document.documentElement.dataset.theme = th;
  else document.documentElement.removeAttribute("data-theme");
}catch(e){ document.documentElement.removeAttribute("data-theme"); }

render();
</script>
