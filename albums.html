<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>들을 앨범 순위</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============ 색상 토큰 (라이트/다크) ============ */
:root{
  color-scheme: light;
  --page:#ffffff;
  --ink:#000000;
  --ink2:#3a3a3a;
  --muted:#757575;
  --rule:#000000;
  --hair:#e5e5e5;
  --red:#ff3530;
  --cover-bg:#f0f0f0;
  --hover:rgba(0,0,0,.03);
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0f0f0f;
    --ink:#ffffff;
    --ink2:#cfcfcf;
    --muted:#9a9a9a;
    --rule:#ffffff;
    --hair:#2a2a2a;
    --red:#ff5a55;
    --cover-bg:#1c1c1c;
    --hover:rgba(255,255,255,.04);
  }
}
html[data-theme="dark"]{
  color-scheme: dark;
  --page:#0f0f0f;
  --ink:#ffffff;
  --ink2:#cfcfcf;
  --muted:#9a9a9a;
  --rule:#ffffff;
  --hair:#2a2a2a;
  --red:#ff5a55;
  --cover-bg:#1c1c1c;
  --hover:rgba(255,255,255,.04);
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Helvetica Neue",Arial,"Malgun Gothic",sans-serif;
  background:var(--page);
  color:var(--ink);
  line-height:1.6;
}

/* ============ 마스트헤드 ============ */
.mast{border-bottom:1px solid var(--rule);text-align:center;padding:22px 16px 18px}
.mast .logo{font-family:"Noto Serif KR",Georgia,serif;font-weight:900;font-size:30px;letter-spacing:-.02em}
.mast .nav{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted)}

main{max-width:980px;margin:0 auto;padding:16px 16px 80px}

/* ============ 접힌 줄 ============ */
.review{border-bottom:1px solid var(--hair)}
.review summary{
  list-style:none;cursor:pointer;
  display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;
  padding:16px 8px;
}
.review summary::-webkit-details-marker{display:none}
.review summary:hover{background:var(--hover)}
.review summary:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.thumb{width:64px;height:64px;background:var(--cover-bg);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sum-text{min-width:0}
.sum-artist{font-size:14px;font-weight:800}
.sum-title{font-family:"Noto Serif KR",Georgia,serif;font-style:italic;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.sum-bnm{display:block;margin-top:2px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.sum-right{display:flex;align-items:center;gap:14px}
.chev{width:10px;height:10px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.review[open] .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.review[open] summary .thumb{opacity:0}

/* ============ 점수 원 ============ */
.score{
  border:3px solid var(--ink);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-variant-numeric:tabular-nums;line-height:1;
}
.score.sm{width:48px;height:48px;border-width:2px;font-size:17px}
.score.lg{width:92px;height:92px;font-size:34px;margin:22px auto 0}
.score.bnm{border-color:var(--red);color:var(--red)}

/* ============ 펼친 리뷰 ============ */
.panel{padding:12px 0 56px}
.review[open] .panel{animation:unfold .45s ease-out}
@keyframes unfold{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .review[open] .panel{animation:none}
  .chev{transition:none}
}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center}
.cover{
  aspect-ratio:1/1;width:100%;max-width:100%;background:var(--cover-bg);
  box-shadow:0 10px 30px rgba(0,0,0,.18);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-family:"Noto Serif KR",Georgia,serif;font-style:italic;color:var(--muted);padding:8px;text-align:center;font-size:12px}
.cover .ph{font-size:18px;padding:20px}
.thumb .ph{display:none}

.head{text-align:center}
.artist{font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.title{font-family:"Noto Serif KR",Georgia,serif;font-style:italic;font-size:30px;font-weight:400;margin-top:6px;line-height:1.25;text-wrap:balance}
.bnm-tag{display:inline-block;margin-top:16px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--red);text-transform:uppercase}
.meta{margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.meta span+span::before{content:"•";margin:0 8px}

.body{max-width:640px;margin:44px auto 0}
.genre{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.dek{font-family:"Noto Serif KR",Georgia,serif;font-size:20px;line-height:1.55;margin-top:18px;word-break:keep-all}
.text{display:flex;flex-direction:column;gap:18px;margin-top:22px}
.text p{font-family:"Noto Serif KR",Georgia,serif;font-size:16px;line-height:1.9;color:var(--ink2);word-break:keep-all}
.tracks{margin-top:26px;font-size:13px;color:var(--muted)}
.tracks b{color:var(--ink);font-weight:700}

/* ============ 한 줄 (리뷰 도입부) ============ */
.line{font-family:"Noto Serif KR",Georgia,serif;font-style:italic;font-size:15px;color:var(--muted);margin-top:18px;word-break:keep-all}

</style>
</head>

const BNM = 8.0;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render(){
  const list = [...ALBUMS].sort((a, b) => b.score - a.score);
  document.getElementById("count").textContent = `${list.length}장의 앨범 · 점수 순`;
  document.getElementById("list").innerHTML = list.map((a, i) => {
    const best = a.score >= BNM;
    const score = a.score.toFixed(1);
    const tracks = a.tracks.map(t => t === a.title_track ? `<b>${esc(t)}</b>` : esc(t)).join(" · ");
    return `
    <details class="review" id="r${i + 1}">
      <summary>
        <div class="thumb" data-title="${esc(a.title)}"><img src="${esc(a.cover)}" alt="" referrerpolicy="no-referrer"></div>
        <div class="sum-text">
          <div class="sum-artist">${esc(a.artist)}</div>
          <div class="sum-title">${esc(a.title)}</div>
          ${best ? `<span class="sum-bnm">Best New Listen</span>` : ""}
        </div>
        <div class="sum-right">
          <div class="score sm${best ? " bnm" : ""}" aria-label="10점 만점에 ${score}점">${score}</div>
          <span class="chev" aria-hidden="true"></span>
        </div>
      </summary>
      <div class="panel">
        <div class="hero">
          <div class="cover" data-title="${esc(a.title)}">
            <img src="${esc(a.cover)}" alt="${esc(a.artist)} — ${esc(a.title)} 앨범 커버" referrerpolicy="no-referrer">
          </div>
          <div class="head">
            <div class="artist">${esc(a.artist)}</div>
            <h2 class="title">${esc(a.title)}</h2>
            <div class="score lg${best ? " bnm" : ""}" aria-label="10점 만점에 ${score}점">${score}</div>
            ${best ? `<div class="bnm-tag">Best New Listen</div>` : ""}
            <div class="meta"><span>${esc(a.label)}</span><span>${esc(a.year)}</span><span>${esc(a.format)}</span></div>
          </div>
        </div>
        <div class="body">
          <div class="genre">${esc(a.genre)}</div>
          <p class="line">${esc(a.line)}</p>
          <p class="dek">${esc(a.dek)}</p>
          <div class="text">${a.text.map(p => `<p>${esc(p)}</p>`).join("")}</div>
          <p class="tracks">수록곡 — ${tracks}</p>
        </div>
      </div>
    </details>`;
  }).join("");

  // 커버를 못 불러오면 제목으로 대체
  document.querySelectorAll(".cover img, .thumb img").forEach(img => {
    const fallback = () => {
      const ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = img.parentElement.dataset.title;
      img.replaceWith(ph);
    };
    if(img.complete && !img.naturalWidth) fallback();
    else img.addEventListener("error", fallback, {once:true});
  });
}

// 한 번에 하나만 펼치기
document.getElementById("list").addEventListener("toggle", e => {
  const d = e.target;
  if(!d.open) return;
  document.querySelectorAll(".review[open]").forEach(o => { if(o !== d) o.open = false; });
  const top = d.getBoundingClientRect().top;
  if(top < 0) d.scrollIntoView({block:"start"});
  if(location.hash !== "#" + d.id) history.replaceState(null, "", "#" + d.id);
}, true);

function openFromHash(){
  const d = location.hash && document.querySelector(location.hash);
  if(d && d.classList.contains("review")){ d.open = true; d.scrollIntoView({block:"start"}); }
}
window.addEventListener("hashchange", openFromHash);

try{
  const th = localStorage.getItem("survey-dashboard-data-v2:theme");
  if(th) document.documentElement.dataset.theme = th;
  else document.documentElement.removeAttribute("data-theme");
}catch(e){ document.documentElement.removeAttribute("data-theme"); }

render();
openFromHash();
</script>
