<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실험 결과 대시보드</title>
<style>
/* ============ 색상 토큰 (라이트/다크) ============ */
:root{
  color-scheme: light;
  --page:#f9f9f7;
  --surface:#fcfcfb;
  --ink:#0b0b0b;
  --ink2:#52514e;
  --muted:#898781;
  --grid:#e1e0d9;
  --axis:#c3c2b7;
  --border:rgba(11,11,11,.10);
  --accent:#2a78d6;
  --wash:rgba(11,11,11,.045);
  --danger:#d03b3b;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d;
    --surface:#1a1a19;
    --ink:#ffffff;
    --ink2:#c3c2b7;
    --muted:#898781;
    --grid:#2c2c2a;
    --axis:#383835;
    --border:rgba(255,255,255,.10);
    --accent:#3987e5;
    --wash:rgba(255,255,255,.06);
    --danger:#e66767;
  }
}
html[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d;
  --surface:#1a1a19;
  --ink:#ffffff;
  --ink2:#c3c2b7;
  --muted:#898781;
  --grid:#2c2c2a;
  --axis:#383835;
  --border:rgba(255,255,255,.10);
  --accent:#3987e5;
  --wash:rgba(255,255,255,.06);
  --danger:#e66767;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  background:var(--page);
  color:var(--ink);
  line-height:1.5;
}

/* ============ 상단 툴바 ============ */
.toolbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 20px;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.toolbar .spacer{flex:1}
.btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);
  color:var(--ink);font:inherit;font-size:13px;font-weight:500;
  padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger-text{color:var(--danger)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{
  width:38px;height:22px;border-radius:11px;background:var(--axis);
  position:relative;transition:background .15s;flex:none;
}
.switch .track::after{
  content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px)}
.edit-hint{font-size:12px;color:var(--muted)}

.layout-wrap{position:relative}
.layout-panel{
  position:absolute;top:calc(100% + 8px);right:0;z-index:30;width:250px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);padding:14px;
  display:flex;flex-direction:column;gap:10px;
}
.lp-row{display:flex;flex-direction:column;gap:4px}
.lp-row label{font-size:12px;font-weight:600;color:var(--ink2)}
.lp-row .lp-input{width:100%;accent-color:var(--accent);cursor:pointer}
.lp-row .lp-val{font-size:11px;color:var(--muted);align-self:flex-end;font-variant-numeric:tabular-nums}
.lp-reset{align-self:flex-start;font-size:12px;padding:5px 10px}
.layout-panel[hidden]{display:none}

/* ============ 레이아웃 ============ */
main{max-width:1240px;margin:0 auto;padding:28px 20px 60px}
.page-head{padding:6px 4px 22px}
.page-head h1{font-size:27px;font-weight:700;letter-spacing:-.3px}
.page-head h1:empty{display:none}
.page-head .subtitle{font-size:14px;color:var(--ink2);margin-top:4px}
.page-head .subtitle:empty{display:none}
.page-head input{display:block;width:100%}
.page-head input.title-input{font-size:27px;font-weight:700;letter-spacing:-.3px}
.page-head input.subtitle-input{font-size:14px;color:var(--ink2);margin-top:8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(480px,100%),1fr));gap:var(--card-gap,20px)}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:var(--card-pad-y,20px) var(--card-pad-x,22px) calc(var(--card-pad-y,20px) - 2px);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  display:flex;flex-direction:column;gap:var(--card-inner-gap,14px);
}
.card-top{display:flex;flex-direction:column;gap:8px}
.card-top .row1{display:flex;align-items:flex-start;gap:10px}
.card-top h3{font-size:16px;font-weight:700;flex:1;letter-spacing:-.2px}
.q-note-view{font-size:12.5px;color:var(--muted)}
.q-note-view:empty{display:none}
.badge{
  flex:none;font-size:12px;font-weight:600;color:var(--ink2);
  background:var(--wash);border-radius:999px;padding:3px 10px;margin-top:1px;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.badge:empty{display:none}
.q-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.q-controls select{flex:none}
.bar-gap-control{display:flex;align-items:center;gap:6px;flex:none}
.bar-gap-control .gap-label{font-size:12px;color:var(--muted);white-space:nowrap}
.bar-gap-control .gap-value{font-size:12px;color:var(--ink2);width:34px;font-variant-numeric:tabular-nums}
.bar-gap-control input[type="range"]{
  width:92px;accent-color:var(--accent);cursor:pointer;height:20px;flex:none;
  background:transparent;padding:0;border:none;
}
.icon-btn{
  appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink2);
  width:28px;height:28px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1;flex:none;
}
.icon-btn:hover{background:var(--wash)}
.icon-btn.del:hover{color:var(--danger);border-color:var(--danger)}

.chart-area{min-height:120px}
.chart-area svg{width:100%;height:auto;display:block}
.chart-area svg text{font-family:inherit}
[data-tip]{cursor:default}
svg [data-tip]:hover{opacity:.82}

/* 원/도넛 + 범례 */
.pie-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pie-wrap svg{flex:1 1 220px;max-width:300px;margin:0 auto}
.legend{list-style:none;flex:1 1 180px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.legend li{display:flex;align-items:center;gap:8px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .lb{color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .vl{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 표 */
.data-table{width:100%;border-collapse:collapse;font-size:13.5px}
.data-table th{
  text-align:left;font-size:12px;font-weight:600;color:var(--muted);
  padding:7px 10px;border-bottom:1px solid var(--axis);
}
.data-table td{padding:8px 10px;border-bottom:1px solid var(--grid)}
.data-table th.num,.data-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.data-table td.num{color:var(--ink2)}
.data-table .bar-cell{width:32%;min-width:100px}
.data-table .tbar-track{background:var(--wash);border-radius:4px;height:14px;overflow:hidden}
.data-table .tbar{height:100%;border-radius:4px 0 0 4px}
.data-table tfoot td{border-bottom:none;font-weight:700;color:var(--ink)}
.data-table tfoot td.num{color:var(--ink)}

.chart-msg{
  padding:24px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;
  border:1px dashed var(--grid);border-radius:10px;
}
.chart-msg .btn{margin-top:10px}

/* ============ 편집 UI ============ */
input,select{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13.5px;
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type="color"]{
  padding:2px;width:34px;height:30px;cursor:pointer;border-radius:7px;flex:none;
}
input.q-title-input{width:100%;font-weight:700;font-size:15px}
input.q-note-input{width:100%;font-size:12.5px;padding:5px 10px}
input.q-unit{width:78px}
input.item-count{width:92px;text-align:right;font-variant-numeric:tabular-nums}
input.item-n{width:52px;text-align:right;font-variant-numeric:tabular-nums}
input.item-median,input.item-sd{width:76px;text-align:right;font-variant-numeric:tabular-nums}

.items-editor{
  border-top:1px dashed var(--grid);padding-top:12px;
  display:flex;flex-direction:column;gap:7px;
}
.stats-table-area{display:none}
.stats-table-area:not(:empty){display:block;border-top:1px dashed var(--grid);padding-top:12px}
.stats-table .num{font-variant-numeric:tabular-nums}
.items-editor .ed-head{font-size:12px;font-weight:600;color:var(--muted)}
.item-row{display:flex;align-items:center;gap:7px}
.item-row .item-label{flex:1;min-width:0}
.item-row .arrows{display:flex;gap:4px;flex:none}
.add-item-btn{align-self:flex-start;margin-top:2px}

.empty-state{
  grid-column:1/-1;text-align:center;padding:70px 20px;
  border:1.5px dashed var(--axis);border-radius:14px;color:var(--muted);font-size:14px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
}

/* 보기/편집 모드 전환 */
.edit-only{display:none !important}
body.edit .edit-only{display:revert !important}
body.edit .item-row{display:flex !important}
body.edit .q-controls{display:flex !important}
body.edit .view-only{display:none !important}

/* 툴팁 */
#tooltip{
  position:fixed;display:none;z-index:99;pointer-events:none;
  background:var(--ink);color:var(--page);font-size:12px;font-weight:500;
  padding:5px 9px;border-radius:7px;box-shadow:0 3px 10px rgba(0,0,0,.25);
  max-width:280px;
}

/* ============ 인쇄/캡처 ============ */
@media print{
  .toolbar,.edit-only,#tooltip{display:none !important}
  body{background:#fff}
  .card{break-inside:avoid;box-shadow:none}
  main{max-width:none;padding:0}
}
</style>
</head>
<body>

<div class="toolbar">
  <label class="switch">
    <input type="checkbox" id="editToggle">
    <span class="track"></span>
    <span>편집 모드</span>
  </label>
  <span class="edit-hint edit-only">변경 사항은 이 브라우저에 자동 저장됩니다</span>
  <span class="spacer"></span>
  <button class="btn primary edit-only" data-action="add-q">＋ 질문 추가</button>
  <button class="btn" data-action="export">JSON 내보내기</button>
  <button class="btn" data-action="import">JSON 불러오기</button>
  <button class="btn edit-only" data-action="sample">기본 데이터</button>
  <button class="btn danger-text edit-only" data-action="reset">전체 초기화</button>
  <span class="layout-wrap edit-only">
    <button class="btn" data-action="layout" title="카드·여백 간격 조절">↔ 간격 설정</button>
    <div class="layout-panel" id="layoutPanel" hidden>
      <div class="lp-row">
        <label>카드 사이 간격</label>
        <input type="range" class="lp-input" data-var="--card-gap" min="0" max="48" step="2" value="20">
        <span class="lp-val" data-for="--card-gap">20px</span>
      </div>
      <div class="lp-row">
        <label>카드 내부 여백(상하)</label>
        <input type="range" class="lp-input" data-var="--card-pad-y" min="6" max="40" step="2" value="20">
        <span class="lp-val" data-for="--card-pad-y">20px</span>
      </div>
      <div class="lp-row">
        <label>카드 내부 여백(좌우)</label>
        <input type="range" class="lp-input" data-var="--card-pad-x" min="6" max="40" step="2" value="22">
        <span class="lp-val" data-for="--card-pad-x">22px</span>
      </div>
      <div class="lp-row">
        <label>카드 안 요소 간격</label>
        <input type="range" class="lp-input" data-var="--card-inner-gap" min="0" max="28" step="2" value="14">
        <span class="lp-val" data-for="--card-inner-gap">14px</span>
      </div>
      <button class="btn lp-reset" data-action="layout-reset">기본값으로</button>
    </div>
  </span>
  <button class="btn" data-action="theme" title="라이트/다크 전환">🌓</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<main>
  <header class="page-head" id="pageHead"></header>
  <div class="cards" id="cards"></div>
</main>

<div id="tooltip"></div>

<script>
"use strict";

/* ============ 검증된 팔레트 ============ */
const CAT  = ["#2a78d6","#1baf7a","#eda100","#008300","#4a3aa7","#e34948","#e87ba4","#eb6834"]; // 범주형 (고정 순서)
const ORD  = ["#86b6ef","#3987e5","#184f95"];  // 순서형 (약 → 강)
const GOOD = "#0ca30c", BAD = "#d03b3b";        // 상태 (정답/오답)

const CHART_TYPES = [
  ["barV","세로 막대"],
  ["barH","가로 막대"],
  ["pie","원그래프"],
  ["donut","도넛 차트"],
  ["line","꺾은선그래프"],
  ["radar","레이더 차트"],
  ["table","표"],
];
const MODES = [["count","응답 수 (비율 표시)"],["value","평균·측정값"]];

const KEY = "survey-dashboard-data-v2";
let _uid = 1;
const uid = () => "q" + (_uid++) + "_" + Date.now().toString(36);

/* ============ 기본 데이터 — 고령층 스마트폰 UI 실험 결과 ============ */
function sampleData(){
  /* a = [라벨, 평균, 중앙값, 표준편차, 표본수] — 중앙값/표준편차/표본수는 보고서 Ⅲ 표와 동일 */
  const ord3 = (a, b, c) => [
    { label:a[0], count:a[1], median:a[2], sd:a[3], n:a[4], color:ORD[0] },
    { label:b[0], count:b[1], median:b[2], sd:b[3], n:b[4], color:ORD[1] },
    { label:c[0], count:c[1], median:c[2], sd:c[3], n:c[4], color:ORD[2] },
  ];
  const ab = (a, b) => [
    { label:a[0], count:a[1], median:a[2], sd:a[3], n:a[4], color:CAT[0] },
    { label:b[0], count:b[1], median:b[2], sd:b[3], n:b[4], color:CAT[1] },
  ];
  return normalize({
    title: "",
    subtitle: "",
    questions: [
      { title:"", note:"", type:"barV", mode:"value", unit:"%",
        items: ord3(["10pt",52.1,62.5,31.39,12], ["14pt",75.0,75.0,22.82,12], ["20pt",89.6,100.0,16.00,12]) },

      { title:"", note:"", type:"line", mode:"value", unit:"초",
        items: ord3(["10pt",5.05,4.75,2.69,12], ["14pt",6.68,6.10,2.29,12], ["20pt",5.71,5.30,2.05,12]) },

      { title:"", note:"", type:"barV", mode:"value", unit:"%",
        items: ord3(["저음",70.5,75.0,25.71,11], ["보통",86.4,100.0,16.39,11], ["고음",93.2,100.0,15.41,11]) },

      { title:"", note:"", type:"barV", mode:"value", unit:"초",
        items: ord3(["저음",5.79,5.80,1.45,11], ["보통",5.81,5.60,1.24,11], ["고음",6.09,6.20,1.65,11]) },

      { title:"", note:"", type:"barV", mode:"value", unit:"%",
        items: ord3(["쉬움",100.0,null,null,12], ["보통",91.7,null,null,12], ["어려움",91.7,null,null,12]) },

      { title:"", note:"", type:"barV", mode:"value", unit:"초",
        items: ord3(["쉬움",5.43,5.05,1.15,12], ["보통",5.18,4.90,1.19,12], ["어려움",7.94,6.60,4.57,12]) },

      { title:"", note:"", type:"line", mode:"value", unit:"초",
        items: ord3(["2개",1.15,0.95,0.61,12], ["4개",1.26,1.20,0.45,12], ["8개",2.80,2.50,1.29,12]) },

      { title:"", note:"", type:"barH", mode:"value", unit:"%",
        items: ab(["경고 OFF",77.8,null,null,36], ["경고 ON",97.0,null,null,33]) },

      { title:"", note:"", type:"barH", mode:"value", unit:"초",
        items: ab(["경고 OFF",2.68,1.45,3.87,36], ["경고 ON",1.70,1.40,1.15,33]) },

      { title:"", note:"", type:"donut", mode:"count", unit:"회",
        items:[{ label:"정답", count:28, color:GOOD }, { label:"오답", count:8, color:BAD }] },

      { title:"", note:"", type:"donut", mode:"count", unit:"회",
        items:[{ label:"정답", count:32, color:GOOD }, { label:"오답", count:1, color:BAD }] },

      { title:"", note:"", type:"barH", mode:"value", unit:"%",
        items: ab(["규칙 기반",60.0,60.0,0.00,11], ["LLM",79.5,79.0,1.37,11]) },

      { title:"", note:"", type:"barH", mode:"value", unit:"%",
        items: ab(["요약 OFF",95.0,100.0,10.00,20], ["요약 ON",92.5,100.0,19.53,20]) },

      { title:"", note:"", type:"barH", mode:"value", unit:"초",
        items: ab(["요약 OFF",6.46,5.10,4.17,20], ["요약 ON",5.52,5.05,1.89,20]) },

      { title:"", note:"", type:"table", mode:"count", unit:"회",
        items:[
          { label:"보이스피싱", count:69, color:CAT[0] },
          { label:"AI 요약", count:40, color:CAT[1] },
          { label:"글씨 크기", count:36, color:CAT[2] },
          { label:"문장 난이도", count:36, color:CAT[3] },
          { label:"버튼 개수", count:36, color:CAT[4] },
          { label:"음성 주파수", count:33, color:CAT[5] },
          { label:"AI 정확도", count:22, color:CAT[6] },
        ]},
    ],
  });
}

function blankData(){
  return { title:"새 설문조사", subtitle:"", questions:[] };
}

/* ============ 상태 ============ */
function normalize(d){
  const out = { title: String(d.title ?? "설문조사"), subtitle: String(d.subtitle ?? ""), questions: [] };
  if (Array.isArray(d.questions)) for (const q of d.questions){
    const nq = {
      id: q.id || uid(),
      title: String(q.title ?? "새 질문"),
      note: String(q.note ?? ""),
      type: CHART_TYPES.some(t => t[0] === q.type) ? q.type : "barV",
      mode: q.mode === "value" ? "value" : "count",
      unit: String(q.unit ?? ""),
      barGap: Number.isFinite(q.barGap) ? Math.min(40, Math.max(0, Math.round(q.barGap))) : 4,
      items: [],
    };
    const numOrNull = v => Number.isFinite(v) ? v : (Number.isFinite(Number(v)) && v !== "" && v !== null ? Number(v) : null);
    if (Array.isArray(q.items)) q.items.forEach((it, i) => {
      nq.items.push({
        label: String(it.label ?? "항목 " + (i+1)),
        count: Math.max(0, Number(it.count) || 0),
        color: /^#[0-9a-fA-F]{6}$/.test(it.color || "") ? it.color : CAT[i % CAT.length],
        median: numOrNull(it.median),
        sd: numOrNull(it.sd),
        n: numOrNull(it.n),
      });
    });
    out.questions.push(nq);
  }
  return out;
}

let state = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if (raw){
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.questions)) return normalize(d);
    }
  }catch(e){}
  return sampleData();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}

/* ============ 유틸 ============ */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmt = n => Number(n).toLocaleString("ko-KR", { maximumFractionDigits: 2 });
const pctOf = (c, t) => t > 0 ? (c / t * 100) : 0;
const pctStr = (c, t) => (Math.round(pctOf(c, t) * 10) / 10).toLocaleString("ko-KR", { maximumFractionDigits: 1 }) + "%";
const r2 = n => Math.round(n * 100) / 100;
const total = q => q.items.reduce((s, it) => s + (Number(it.count) || 0), 0);
const isCount = q => q.mode !== "value";

/* 값 표기 — 단위 포함 */
const vstr = (q, v) => fmt(v) + (q.unit || "");
/* 배지 — 응답 수 모드는 합계, 측정값 모드는 단위 */
function badgeText(q){
  if (isCount(q)) return "합계 " + fmt(total(q)) + (q.unit || "");
  return q.unit ? "단위 " + q.unit : "";
}
/* 툴팁 문구 */
function tipAttr(q, it){
  const body = isCount(q)
    ? `${vstr(q, it.count)} (${pctStr(it.count, total(q))})`
    : vstr(q, it.count);
  return `data-tip="${esc(it.label)} · ${esc(body)}"`;
}

const _mctx = document.createElement("canvas").getContext("2d");
function tw(text, size = 12, weight = 400){
  _mctx.font = `${weight} ${size}px "Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif`;
  return _mctx.measureText(text).width;
}
function truncate(label, maxW, size = 12){
  if (tw(label, size) <= maxW) return label;
  let s = label;
  while (s.length > 1 && tw(s + "…", size) > maxW) s = s.slice(0, -1);
  return s + "…";
}
function wrapLabel(label, maxW, size = 12){
  const lines = []; let cur = "";
  for (let i = 0; i < label.length; i++){
    const ch = label[i];
    if (cur && tw(cur + ch, size) > maxW){
      lines.push(cur); cur = ch;
      if (lines.length === 2){
        const rest = lines.pop() + label.slice(i);
        lines.push(truncate(rest, maxW, size));
        return lines;
      }
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [""];
}
function niceScale(maxVal){
  if (!(maxVal > 0)) return { max: 4, ticks: [0,1,2,3,4] };
  const rough = maxVal / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1,2,2.5,5,10].map(c => c * pow).find(s => Math.ceil(maxVal / s) <= 5) || 10 * pow;
  const top = Math.ceil(maxVal / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(r2(v));
  return { max: top, ticks };
}

/* ============ 차트 렌더러 (순수 SVG) ============ */

function chartHTML(q){
  if (!q.items.length)
    return `<div class="chart-msg">아직 항목이 없습니다. 편집 모드에서 <b>＋ 항목 추가</b>를 눌러 데이터를 입력하세요.</div>`;
  if ((q.type === "pie" || q.type === "donut") && !isCount(q))
    return `<div class="chart-msg">
      <b>평균·측정값</b>은 모두 더해도 전체가 되지 않기 때문에<br>
      원그래프·도넛으로 그리면 실제보다 왜곡되어 보입니다.<br>
      막대그래프로 비교하는 것을 권장합니다.
      <button class="btn" data-action="to-bar">세로 막대로 보기</button>
    </div>`;
  switch(q.type){
    case "barH":  return barH(q);
    case "pie":   return pieDonut(q, false);
    case "donut": return pieDonut(q, true);
    case "line":  return lineChart(q);
    case "radar": return radarChart(q);
    case "table": return tableChart(q);
    default:      return barV(q);
  }
}

/* --- 세로 막대 --- */
function barV(q){
  const n = q.items.length;
  const W = 640, H = 340, m = { t: 30, r: 14, b: 54, l: 48 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const sc = niceScale(Math.max(...q.items.map(i => i.count)));
  /* 슬라이더 값(px)이 곧 막대 사이 여백 — 막대 두께는 남는 폭을 채우도록 계산됨 */
  const gapPx = Math.min(q.barGap, n > 1 ? Math.max(0, (pw - 4 * n) / (n - 1)) : 0);
  const band = pw / n;
  const bw = n > 1 ? (pw - gapPx * (n - 1)) / n : pw;
  const step = bw + gapPx;
  const y = v => m.t + ph - (v / sc.max) * ph;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(q.title)} 세로 막대그래프">`;
  for (const tv of sc.ticks){
    const ty = r2(y(tv));
    s += `<line x1="${m.l}" y1="${ty}" x2="${W-m.r}" y2="${ty}" stroke="${tv===0?'var(--axis)':'var(--grid)'}" stroke-width="1"/>`;
    s += `<text x="${m.l-8}" y="${ty+4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(tv)}</text>`;
  }
  q.items.forEach((it, i) => {
    const x0 = r2(m.l + step * i);
    const yTop = y(it.count), h = m.t + ph - yTop;
    const bx1 = r2(x0 + bw), byTop = r2(yTop), by0 = m.t + ph;
    if (h >= 4){
      s += `<path ${tipAttr(q, it)} fill="${it.color}" d="M${x0},${by0} L${x0},${r2(byTop+4)} Q${x0},${byTop} ${r2(x0+4)},${byTop} L${r2(bx1-4)},${byTop} Q${bx1},${byTop} ${bx1},${r2(byTop+4)} L${bx1},${by0} Z"/>`;
    } else if (h > 0){
      s += `<rect ${tipAttr(q, it)} fill="${it.color}" x="${x0}" y="${byTop}" width="${bw}" height="${r2(h)}"/>`;
    }
    s += `<text x="${r2(x0+bw/2)}" y="${r2((h>0?byTop:by0)-7)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink2)" style="font-variant-numeric:tabular-nums">${esc(vstr(q, it.count))}</text>`;
    wrapLabel(it.label, band - 8).forEach((ln, li) => {
      s += `<text x="${r2(x0+bw/2)}" y="${by0 + 16 + li*14}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(ln)}</text>`;
    });
  });
  return s + `</svg>`;
}

/* --- 가로 막대 --- */
function barH(q){
  const n = q.items.length;
  const rowH = 40;
  const bh = Math.max(4, rowH - q.barGap);
  const labelW = Math.min(170, Math.max(...q.items.map(i => tw(i.label, 12.5))) + 18);
  const W = 640, m = { t: 10, r: 76, b: 30, l: r2(labelW) };
  const H = m.t + n * rowH + m.b;
  const pw = W - m.l - m.r;
  const sc = niceScale(Math.max(...q.items.map(i => i.count)));
  const x = v => m.l + (v / sc.max) * pw;

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(q.title)} 가로 막대그래프">`;
  for (const tv of sc.ticks){
    const tx = r2(x(tv));
    s += `<line x1="${tx}" y1="${m.t}" x2="${tx}" y2="${H-m.b}" stroke="${tv===0?'var(--axis)':'var(--grid)'}" stroke-width="1"/>`;
    s += `<text x="${tx}" y="${H-m.b+16}" text-anchor="middle" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(tv)}</text>`;
  }
  q.items.forEach((it, i) => {
    const cy = m.t + rowH * i + rowH / 2;
    const y0 = r2(cy - bh / 2), y1 = r2(cy + bh / 2);
    const xe = x(it.count), w = xe - m.l;
    if (w >= 4){
      s += `<path ${tipAttr(q, it)} fill="${it.color}" d="M${m.l},${y0} L${r2(xe-4)},${y0} Q${r2(xe)},${y0} ${r2(xe)},${r2(y0+4)} L${r2(xe)},${r2(y1-4)} Q${r2(xe)},${y1} ${r2(xe-4)},${y1} L${m.l},${y1} Z"/>`;
    } else if (w > 0){
      s += `<rect ${tipAttr(q, it)} fill="${it.color}" x="${m.l}" y="${y0}" width="${r2(w)}" height="${bh}"/>`;
    }
    s += `<text x="${m.l-9}" y="${r2(cy+4)}" text-anchor="end" font-size="12.5" fill="var(--ink)">${esc(truncate(it.label, labelW - 14, 12.5))}</text>`;
    s += `<text x="${r2(Math.max(xe, m.l)+8)}" y="${r2(cy+4)}" font-size="12" font-weight="600" fill="var(--ink2)" style="font-variant-numeric:tabular-nums">${esc(vstr(q, it.count))}</text>`;
  });
  return s + `</svg>`;
}

/* --- 원그래프 / 도넛 (응답 수 모드 전용) --- */
function pieDonut(q, donut){
  const t = total(q);
  const S = 300, cx = S/2, cy = S/2, r = 128, ri = donut ? 76 : 0;
  const polar = (rad, a) => [r2(cx + rad * Math.cos(a)), r2(cy + rad * Math.sin(a))];

  let svg = `<svg viewBox="0 0 ${S} ${S}" role="img" aria-label="${esc(q.title)} ${donut?'도넛 차트':'원그래프'}">`;
  const visible = q.items.filter(it => it.count > 0);
  if (t <= 0){
    svg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--grid)" stroke-width="2"/>`;
    svg += `<text x="${cx}" y="${cy+4}" text-anchor="middle" font-size="13" fill="var(--muted)">응답 없음</text>`;
  } else if (visible.length === 1){
    const it = visible[0];
    if (donut)
      svg += `<circle ${tipAttr(q, it)} cx="${cx}" cy="${cy}" r="${(r+ri)/2}" fill="none" stroke="${it.color}" stroke-width="${r-ri}"/>`;
    else
      svg += `<circle ${tipAttr(q, it)} cx="${cx}" cy="${cy}" r="${r}" fill="${it.color}"/>`;
  } else {
    let a0 = -Math.PI / 2;
    for (const it of visible){
      const a1 = a0 + (it.count / t) * Math.PI * 2;
      const laf = (a1 - a0) > Math.PI ? 1 : 0;
      const [x0o,y0o] = polar(r, a0), [x1o,y1o] = polar(r, a1);
      let d;
      if (donut){
        const [x0i,y0i] = polar(ri, a0), [x1i,y1i] = polar(ri, a1);
        d = `M${x0o},${y0o} A${r},${r} 0 ${laf} 1 ${x1o},${y1o} L${x1i},${y1i} A${ri},${ri} 0 ${laf} 0 ${x0i},${y0i} Z`;
      } else {
        d = `M${cx},${cy} L${x0o},${y0o} A${r},${r} 0 ${laf} 1 ${x1o},${y1o} Z`;
      }
      svg += `<path ${tipAttr(q, it)} d="${d}" fill="${it.color}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>`;
      a0 = a1;
    }
  }
  if (donut && t > 0){
    svg += `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="30" font-weight="600" fill="var(--ink)">${fmt(t)}</text>`;
    svg += `<text x="${cx}" y="${cy+20}" text-anchor="middle" font-size="12" fill="var(--muted)">전체${q.unit?" ("+esc(q.unit)+")":""}</text>`;
  }
  svg += `</svg>`;

  const legend = q.items.map(it => `
    <li ${tipAttr(q, it)}>
      <span class="sw" style="background:${it.color}"></span>
      <span class="lb">${esc(it.label)}</span>
      <span class="vl">${esc(vstr(q, it.count))} · ${pctStr(it.count, t)}</span>
    </li>`).join("");

  return `<div class="pie-wrap">${svg}<ul class="legend">${legend}</ul></div>`;
}

/* --- 꺾은선 --- */
function lineChart(q){
  const n = q.items.length;
  const W = 640, H = 340, m = { t: 30, r: 24, b: 54, l: 48 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const sc = niceScale(Math.max(...q.items.map(i => i.count)));
  const band = pw / n;
  const px = i => r2(m.l + band * (i + 0.5));
  const py = v => r2(m.t + ph - (v / sc.max) * ph);
  const color = CAT[0];

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(q.title)} 꺾은선그래프">`;
  for (const tv of sc.ticks){
    const ty = py(tv);
    s += `<line x1="${m.l}" y1="${ty}" x2="${W-m.r}" y2="${ty}" stroke="${tv===0?'var(--axis)':'var(--grid)'}" stroke-width="1"/>`;
    s += `<text x="${m.l-8}" y="${ty+4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(tv)}</text>`;
  }
  if (n > 1){
    const d = q.items.map((it, i) => `${i ? "L" : "M"}${px(i)},${py(it.count)}`).join(" ");
    s += `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  /* 점이 적으면 전부 라벨, 많으면 끝점과 최대점만 */
  const maxIdx = q.items.reduce((mi, it, i) => it.count > q.items[mi].count ? i : mi, 0);
  const labelAll = n <= 5;
  q.items.forEach((it, i) => {
    s += `<circle ${tipAttr(q, it)} cx="${px(i)}" cy="${py(it.count)}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
    if (labelAll || i === n - 1 || i === maxIdx){
      s += `<text x="${px(i)}" y="${r2(py(it.count)-11)}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink2)" style="font-variant-numeric:tabular-nums">${esc(vstr(q, it.count))}</text>`;
    }
    wrapLabel(it.label, band - 8).forEach((ln, li) => {
      s += `<text x="${px(i)}" y="${m.t + ph + 16 + li*14}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(ln)}</text>`;
    });
  });
  return s + `</svg>`;
}

/* --- 레이더 --- */
function radarChart(q){
  const n = q.items.length;
  if (n < 3)
    return `<div class="chart-msg">레이더 차트는 항목이 <b>3개 이상</b>일 때 표시됩니다. 항목을 추가하거나 다른 그래프를 선택하세요.</div>`;
  const W = 480, H = 380, cx = W/2, cy = H/2, R = 118;
  const sc = niceScale(Math.max(...q.items.map(i => i.count)));
  const ang = i => -Math.PI / 2 + (Math.PI * 2 * i) / n;
  const pt = (i, v) => [r2(cx + (v / sc.max) * R * Math.cos(ang(i))), r2(cy + (v / sc.max) * R * Math.sin(ang(i)))];
  const color = CAT[0];

  let s = `<svg viewBox="0 0 ${W} ${H}" style="max-width:500px;margin:0 auto" role="img" aria-label="${esc(q.title)} 레이더 차트">`;
  const lastTick = sc.ticks[sc.ticks.length - 1];
  for (const tv of sc.ticks){
    if (tv === 0) continue;
    const ring = q.items.map((_, i) => pt(i, tv).join(",")).join(" ");
    s += `<polygon points="${ring}" fill="none" stroke="var(--grid)" stroke-width="1"/>`;
    if (tv !== lastTick)
      s += `<text x="${cx+6}" y="${r2(cy - (tv/sc.max)*R - 3)}" font-size="10" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${fmt(tv)}</text>`;
  }
  q.items.forEach((_, i) => {
    const [x, y] = pt(i, sc.max);
    s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
  });
  const poly = q.items.map((it, i) => pt(i, it.count).join(",")).join(" ");
  s += `<polygon points="${poly}" fill="${color}" fill-opacity="0.12" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  q.items.forEach((it, i) => {
    const [x, y] = pt(i, it.count);
    s += `<circle ${tipAttr(q, it)} cx="${x}" cy="${y}" r="4.5" fill="${color}" stroke="var(--surface)" stroke-width="2"/>`;
    const a = ang(i);
    const lx = r2(cx + (R + 16) * Math.cos(a)), ly = r2(cy + (R + 16) * Math.sin(a));
    const anchor = Math.abs(Math.cos(a)) < 0.35 ? "middle" : (Math.cos(a) > 0 ? "start" : "end");
    const dy = Math.abs(Math.sin(a)) < 0.35 ? 4 : (Math.sin(a) > 0 ? 12 : -4);
    s += `<text x="${lx}" y="${r2(ly+dy)}" text-anchor="${anchor}" font-size="12" fill="var(--ink2)">${esc(truncate(it.label, 96))}</text>`;
    s += `<text x="${lx}" y="${r2(ly+dy+14)}" text-anchor="${anchor}" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${esc(vstr(q, it.count))}</text>`;
  });
  return s + `</svg>`;
}

/* --- 표 --- */
function tableChart(q){
  const t = total(q);
  const maxC = Math.max(...q.items.map(i => i.count), 1);
  const cnt = isCount(q);
  const valHead = cnt ? "응답 수" : "값" + (q.unit ? ` (${esc(q.unit)})` : "");

  const rows = q.items.map(it => `
    <tr ${tipAttr(q, it)}>
      <td>${esc(it.label)}</td>
      <td class="num">${cnt ? fmt(it.count) : esc(vstr(q, it.count))}</td>
      ${cnt ? `<td class="num">${pctStr(it.count, t)}</td>` : ``}
      <td class="bar-cell"><div class="tbar-track"><div class="tbar" style="width:${r2(pctOf(it.count, maxC))}%;background:${it.color}"></div></div></td>
    </tr>`).join("");

  const foot = cnt
    ? `<tr><td>합계</td><td class="num">${fmt(t)}</td><td class="num">${t>0?"100%":"-"}</td><td></td></tr>`
    : `<tr><td>평균</td><td class="num">${esc(vstr(q, r2(t / (q.items.length || 1))))}</td><td></td></tr>`;

  return `<table class="data-table">
    <thead><tr><th>${cnt ? "항목" : "조건"}</th><th class="num">${valHead}</th>${cnt ? `<th class="num">비율(%)</th>` : ``}<th class="bar-cell">분포</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot>${foot}</tfoot>
  </table>`;
}

/* --- 상세 통계 표 (보고서와 동일: 표본수·평균·중앙값·표준편차) --- */
function hasDetailStats(q){
  return isCount(q) === false && q.items.some(it => it.n != null || it.median != null || it.sd != null);
}
function statsTableHTML(q){
  const dash = v => v == null ? "–" : fmt(v);
  const rows = q.items.map(it => `
    <tr>
      <td>${esc(it.label)}</td>
      <td class="num">${dash(it.n)}</td>
      <td class="num">${esc(vstr(q, it.count))}</td>
      <td class="num">${it.median == null ? "–" : esc(vstr(q, it.median))}</td>
      <td class="num">${dash(it.sd)}</td>
    </tr>`).join("");
  return `<table class="data-table stats-table">
    <thead><tr><th>조건</th><th class="num">표본 수</th><th class="num">평균</th><th class="num">중앙값</th><th class="num">표준편차</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

/* ============ 화면 렌더 ============ */

function render(){
  renderHead();
  renderCards();
}

function renderHead(){
  document.title = state.title || "실험 결과 대시보드";
  document.getElementById("pageHead").innerHTML = `
    <h1 class="view-only">${esc(state.title)}</h1>
    <p class="subtitle view-only">${esc(state.subtitle)}</p>
    <input class="title-input edit-only" data-field="title" value="${esc(state.title)}" placeholder="제목을 입력하세요">
    <input class="subtitle-input edit-only" data-field="subtitle" value="${esc(state.subtitle)}" placeholder="부제 (선택) — 예: 조사 기간, 응답자 수">`;
}

function selectHTML(cls, opts, cur, label){
  return `<select class="${cls}" aria-label="${label}">` +
    opts.map(([v, l]) => `<option value="${v}"${cur===v?" selected":""}>${l}</option>`).join("") +
    `</select>`;
}

function cardHTML(q, idx){
  const valMode = !isCount(q);
  const items = q.items.map((it, i) => `
    <div class="item-row" data-idx="${i}">
      <input type="color" class="item-color" value="${it.color}" aria-label="항목 색상">
      <input class="item-label" value="${esc(it.label)}" placeholder="항목 이름">
      <input class="item-count" type="number" min="0" step="any" value="${it.count}" aria-label="값" title="평균/값">
      ${valMode ? `
      <input class="item-n" type="number" min="0" step="1" value="${it.n ?? ""}" placeholder="n" aria-label="표본 수" title="표본 수(선택)">
      <input class="item-median" type="number" step="any" value="${it.median ?? ""}" placeholder="중앙값" aria-label="중앙값" title="중앙값(선택)">
      <input class="item-sd" type="number" step="any" min="0" value="${it.sd ?? ""}" placeholder="표준편차" aria-label="표준편차" title="표준편차(선택)">` : ``}
      <span class="arrows">
        <button class="icon-btn" data-action="up-item" title="위로">↑</button>
        <button class="icon-btn" data-action="down-item" title="아래로">↓</button>
        <button class="icon-btn del" data-action="del-item" title="항목 삭제">✕</button>
      </span>
    </div>`).join("");

  const showGap = q.type === "barV" || q.type === "barH";
  return `
  <section class="card" data-id="${q.id}" data-type="${q.type}">
    <div class="card-top">
      <div class="row1">
        <h3 class="view-only">Q${idx+1}. ${esc(q.title)}</h3>
        <input class="q-title-input edit-only" value="${esc(q.title)}" placeholder="질문·항목명을 입력하세요">
        <span class="badge">${esc(badgeText(q))}</span>
      </div>
      <p class="q-note-view view-only">${esc(q.note)}</p>
      <input class="q-note-input edit-only" value="${esc(q.note)}" placeholder="설명 (선택) — 예: 조건당 12회 시행">
      <div class="q-controls edit-only">
        ${selectHTML("q-type", CHART_TYPES, q.type, "그래프 종류")}
        ${selectHTML("q-mode", MODES, q.mode, "값 유형")}
        <input class="q-unit" value="${esc(q.unit)}" placeholder="단위" aria-label="단위">
        <span class="bar-gap-control" style="${showGap ? "" : "display:none"}">
          <label class="gap-label">막대 간격</label>
          <input type="range" class="q-bargap" min="0" max="40" step="2" value="${q.barGap}" aria-label="막대 간격(px)">
          <span class="gap-value">${q.barGap}px</span>
        </span>
        <button class="icon-btn" data-action="up-q" title="질문 위로">↑</button>
        <button class="icon-btn" data-action="down-q" title="질문 아래로">↓</button>
        <button class="icon-btn del" data-action="del-q" title="질문 삭제">✕</button>
      </div>
    </div>
    <div class="chart-area">${chartHTML(q)}</div>
    <div class="stats-table-area">${hasDetailStats(q) ? statsTableHTML(q) : ""}</div>
    <div class="items-editor edit-only">
      <div class="ed-head">${isCount(q) ? "항목 · 응답 수" : "조건 · 측정값"} (입력 즉시 그래프에 반영)</div>
      ${items}
      <button class="btn add-item-btn" data-action="add-item">＋ 항목 추가</button>
    </div>
  </section>`;
}

function renderCards(){
  const el = document.getElementById("cards");
  if (!state.questions.length){
    el.innerHTML = `
      <div class="empty-state">
        <div>아직 질문이 없습니다.<br>편집 모드를 켜고 <b>질문 추가</b>를 눌러 데이터를 입력하세요.</div>
        <button class="btn primary" data-action="add-q">＋ 질문 추가</button>
      </div>`;
    return;
  }
  el.innerHTML = state.questions.map(cardHTML).join("");
}

/* 카드 부분 갱신 (입력 포커스 유지를 위해 차트 영역만 다시 그림) */
function refreshChart(qid){
  const q = state.questions.find(x => x.id === qid);
  const card = document.querySelector(`.card[data-id="${qid}"]`);
  if (!q || !card) return;
  card.querySelector(".chart-area").innerHTML = chartHTML(q);
  card.querySelector(".stats-table-area").innerHTML = hasDetailStats(q) ? statsTableHTML(q) : "";
  card.querySelector(".badge").textContent = badgeText(q);
  card.querySelector(".ed-head").textContent =
    (isCount(q) ? "항목 · 응답 수" : "조건 · 측정값") + " (입력 즉시 그래프에 반영)";
}

/* ============ 이벤트 ============ */

const findQ = el => {
  const card = el.closest(".card");
  return card ? state.questions.find(q => q.id === card.dataset.id) : null;
};

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.field === "title" || el.dataset.field === "subtitle"){
    state[el.dataset.field] = el.value;
    const head = document.getElementById("pageHead");
    head.querySelector(el.dataset.field === "title" ? "h1" : ".subtitle").textContent = el.value;
    if (el.dataset.field === "title") document.title = el.value || "실험 결과 대시보드";
    save(); return;
  }
  const q = findQ(el);
  if (!q) return;

  if (el.classList.contains("q-title-input")){
    q.title = el.value;
    const idx = state.questions.indexOf(q);
    el.closest(".card").querySelector("h3").textContent = `Q${idx+1}. ${el.value}`;
    save(); return;
  }
  if (el.classList.contains("q-note-input")){
    q.note = el.value;
    el.closest(".card").querySelector(".q-note-view").textContent = el.value;
    save(); return;
  }
  if (el.classList.contains("q-unit")){
    q.unit = el.value;
    refreshChart(q.id); save(); return;
  }
  if (el.classList.contains("q-bargap")){
    q.barGap = Math.min(40, Math.max(0, parseInt(el.value, 10) || 0));
    el.closest(".bar-gap-control").querySelector(".gap-value").textContent = q.barGap + "px";
    refreshChart(q.id); save(); return;
  }
  const row = el.closest(".item-row");
  if (row){
    const it = q.items[+row.dataset.idx];
    if (!it) return;
    const numOrNull = v => v === "" ? null : (Number.isFinite(parseFloat(v)) ? parseFloat(v) : null);
    if (el.classList.contains("item-label")) it.label = el.value;
    else if (el.classList.contains("item-count")) it.count = Math.max(0, parseFloat(el.value) || 0);
    else if (el.classList.contains("item-color")) it.color = el.value;
    else if (el.classList.contains("item-n")) it.n = numOrNull(el.value);
    else if (el.classList.contains("item-median")) it.median = numOrNull(el.value);
    else if (el.classList.contains("item-sd")){ const v = numOrNull(el.value); it.sd = v === null ? null : Math.max(0, v); }
    refreshChart(q.id); save();
  }
});

document.addEventListener("change", e => {
  const q = findQ(e.target);
  if (!q) return;
  if (e.target.classList.contains("q-type")){
    q.type = e.target.value; refreshChart(q.id); save();
    const card = e.target.closest(".card");
    card.dataset.type = q.type;
    const gapCtl = card.querySelector(".bar-gap-control");
    if (gapCtl) gapCtl.style.display = (q.type === "barV" || q.type === "barH") ? "" : "none";
  } else if (e.target.classList.contains("q-mode")){
    q.mode = e.target.value; refreshChart(q.id); save();
  }
});

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const act = btn.dataset.action;
  const q = findQ(btn);
  const qi = q ? state.questions.indexOf(q) : -1;
  const row = btn.closest(".item-row");
  const ii = row ? +row.dataset.idx : -1;

  switch(act){
    case "add-q":{
      const nq = { id: uid(), title: "새 질문", note: "", type: "barV", mode: "count", unit: "",
        items: [
          { label: "항목 1", count: 0, color: CAT[0] },
          { label: "항목 2", count: 0, color: CAT[1] },
        ]};
      state.questions.push(nq);
      render(); save();
      const card = document.querySelector(`.card[data-id="${nq.id}"]`);
      if (card){ card.scrollIntoView({ behavior: "smooth", block: "center" }); card.querySelector(".q-title-input")?.select(); }
      break;
    }
    case "to-bar":
      if (q){
        q.type = "barV";
        const sel = btn.closest(".card").querySelector(".q-type");
        if (sel) sel.value = "barV";
        refreshChart(q.id); save();
      }
      break;
    case "del-q":
      if (q && confirm(`"${q.title}" 항목을 삭제할까요?`)){
        state.questions.splice(qi, 1); render(); save();
      }
      break;
    case "up-q":
      if (q && qi > 0){ [state.questions[qi-1], state.questions[qi]] = [state.questions[qi], state.questions[qi-1]]; render(); save(); }
      break;
    case "down-q":
      if (q && qi < state.questions.length - 1){ [state.questions[qi+1], state.questions[qi]] = [state.questions[qi], state.questions[qi+1]]; render(); save(); }
      break;
    case "add-item":
      if (q){
        q.items.push({ label: "항목 " + (q.items.length + 1), count: 0, color: CAT[q.items.length % CAT.length] });
        render(); save();
        document.querySelector(`.card[data-id="${q.id}"] .item-row:last-of-type .item-label`)?.select();
      }
      break;
    case "del-item":
      if (q && ii >= 0){ q.items.splice(ii, 1); render(); save(); }
      break;
    case "up-item":
      if (q && ii > 0){ [q.items[ii-1], q.items[ii]] = [q.items[ii], q.items[ii-1]]; render(); save(); }
      break;
    case "down-item":
      if (q && ii >= 0 && ii < q.items.length - 1){ [q.items[ii+1], q.items[ii]] = [q.items[ii], q.items[ii+1]]; render(); save(); }
      break;
    case "export":{
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (state.title || "dashboard").replace(/[\\/:*?"<>|]/g, "_") + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
      break;
    }
    case "import":
      document.getElementById("importFile").click();
      break;
    case "sample":
      if (confirm("현재 내용을 지우고 기본 데이터(실험 결과)를 다시 불러올까요?")){
        state = sampleData(); render(); save();
      }
      break;
    case "reset":
      if (confirm("모든 내용을 지우고 빈 대시보드로 초기화할까요?\n(내보내기를 하지 않았다면 복구할 수 없습니다)")){
        state = blankData(); render(); save();
      }
      break;
    case "theme":{
      const html = document.documentElement;
      const dark = html.dataset.theme === "dark" ||
        (!html.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
      html.dataset.theme = dark ? "light" : "dark";
      try{ localStorage.setItem(KEY + ":theme", html.dataset.theme); }catch(e){}
      break;
    }
    case "layout":{
      const panel = document.getElementById("layoutPanel");
      panel.hidden = !panel.hidden;
      e.stopPropagation();
      break;
    }
    case "layout-reset":
      resetLayout();
      break;
  }
});

/* 패널 바깥을 클릭하면 닫기 */
document.addEventListener("click", e => {
  const panel = document.getElementById("layoutPanel");
  if (!panel || panel.hidden) return;
  if (!e.target.closest(".layout-wrap")) panel.hidden = true;
});

/* ============ 레이아웃(간격) 커스텀 ============ */
const LAYOUT_DEFAULTS = { "--card-gap": 20, "--card-pad-y": 20, "--card-pad-x": 22, "--card-inner-gap": 14 };
const LAYOUT_KEY = KEY + ":layout";

function applyLayout(vars){
  for (const k in vars){
    document.documentElement.style.setProperty(k, vars[k] + "px");
    const input = document.querySelector(`.lp-input[data-var="${k}"]`);
    const val = document.querySelector(`.lp-val[data-for="${k}"]`);
    if (input) input.value = vars[k];
    if (val) val.textContent = vars[k] + "px";
  }
}
function saveLayout(vars){
  try{ localStorage.setItem(LAYOUT_KEY, JSON.stringify(vars)); }catch(e){}
}
function loadLayout(){
  try{
    const raw = localStorage.getItem(LAYOUT_KEY);
    if (raw) return Object.assign({}, LAYOUT_DEFAULTS, JSON.parse(raw));
  }catch(e){}
  return Object.assign({}, LAYOUT_DEFAULTS);
}
function resetLayout(){
  applyLayout(LAYOUT_DEFAULTS);
  try{ localStorage.removeItem(LAYOUT_KEY); }catch(e){}
}

let layoutState = loadLayout();
applyLayout(layoutState);

document.addEventListener("input", e => {
  if (!e.target.classList.contains("lp-input")) return;
  const key = e.target.dataset.var;
  const v = Math.max(0, parseInt(e.target.value, 10) || 0);
  layoutState[key] = v;
  applyLayout({ [key]: v });
  saveLayout(layoutState);
});

document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.questions)) throw new Error("bad format");
      state = normalize(d);
      render(); save();
    }catch(err){
      alert("JSON 파일을 읽을 수 없습니다. 이 대시보드에서 내보낸 파일인지 확인해 주세요.");
    }
  };
  reader.readAsText(file);
});

/* 편집 모드 토글 */
const editToggle = document.getElementById("editToggle");
editToggle.addEventListener("change", () => {
  document.body.classList.toggle("edit", editToggle.checked);
});

/* 툴팁 */
const tip = document.getElementById("tooltip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest?.("[data-tip]");
  if (t){
    tip.textContent = t.dataset.tip;
    tip.style.display = "block";
    tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
    tip.style.top = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 8) + "px";
  } else {
    tip.style.display = "none";
  }
});

/* 테마 복원 — 기본값은 라이트 모드(시스템 설정과 무관), 사용자가 토글을 누른 적이 있으면 그 선택을 기억 */
try{
  const th = localStorage.getItem(KEY + ":theme");
  document.documentElement.dataset.theme = (th === "dark") ? "dark" : "light";
}catch(e){
  document.documentElement.dataset.theme = "light";
}

render();
</script>
</body>
</html>
